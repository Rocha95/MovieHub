services:
  db:
    image: postgres:16-alpine
    container_name: moviehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: moviehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - moviehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: moviehub-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/moviehub
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      TMDB_API_KEY: ${TMDB_API_KEY:?Configure TMDB_API_KEY no arquivo .env}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
      INGRESSO_PARTNERSHIPS: ${INGRESSO_PARTNERSHIPS:-cinemark,cinepolis,uci,moviecom}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: moviehub-frontend
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  moviehub_pgdata:
